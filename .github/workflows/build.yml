name: Build Universal Downloader

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a GitHub Release for this build'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore keystore from secret
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore.jks

      - name: Decode google-services.json (if present)
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json
          else
            echo "Skipping — Firebase not yet configured"
          fi

      - name: Compute build metadata
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          COMMIT_MSG=$(git log -1 --pretty=%s)
          COMMIT_AUTHOR=$(git log -1 --pretty=%an)
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"
          echo "commit_msg=$COMMIT_MSG" >> "$GITHUB_OUTPUT"
          echo "commit_author=$COMMIT_AUTHOR" >> "$GITHUB_OUTPUT"

      - name: Generate changelog since last tag
        id: changelog
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            echo "Changes since $LAST_TAG:" > changelog.txt
            git log "$LAST_TAG"..HEAD --pretty="- %s (%an)" >> changelog.txt
          else
            echo "Initial build — full commit history:" > changelog.txt
            git log --pretty="- %s (%an)" | head -30 >> changelog.txt
          fi
          echo "=== Changelog ==="
          cat changelog.txt
          {
            echo "changelog<<CHANGELOG_EOF"
            cat changelog.txt
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run Android Lint
        run: ./gradlew lintDebug --stacktrace
        continue-on-error: true

      - name: Upload Lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
        continue-on-error: true

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: ignore

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build Release APKs (universal + split ABIs)
        run: ./gradlew assembleRelease --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        continue-on-error: true

      - name: Build Release AAB (App Bundle)
        run: ./gradlew bundleRelease --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        continue-on-error: true

      - name: Organize and label release artifacts
        if: always()
        run: |
          mkdir -p artifacts/universal artifacts/split-abi artifacts/aab

          find app/build/outputs/apk/release -iname "*universal*.apk" -exec cp {} artifacts/universal/ \; 2>/dev/null || true
          find app/build/outputs/apk/release -iname "*.apk" ! -iname "*universal*" -exec cp {} artifacts/split-abi/ \; 2>/dev/null || true
          find app/build/outputs/bundle/release -iname "*.aab" -exec cp {} artifacts/aab/ \; 2>/dev/null || true

          SHA="${{ steps.meta.outputs.short_sha }}"
          for f in artifacts/universal/*.apk; do
            [ -f "$f" ] && mv "$f" "artifacts/universal/UniversalDownloader-universal-$SHA.apk"
          done

          echo "=== Universal APK ==="
          ls -la artifacts/universal/ 2>/dev/null || echo "none"
          echo "=== Split ABI APKs ==="
          ls -la artifacts/split-abi/ 2>/dev/null || echo "none"
          echo "=== AAB ==="
          ls -la artifacts/aab/ 2>/dev/null || echo "none"

      - name: Generate APK size report
        if: always()
        run: |
          echo "=== APK Size Report ===" > artifacts/size-report.txt
          for f in artifacts/universal/*.apk artifacts/split-abi/*.apk; do
            if [ -f "$f" ]; then
              SIZE=$(du -h "$f" | cut -f1)
              echo "$(basename "$f"): $SIZE" >> artifacts/size-report.txt
            fi
          done
          cat artifacts/size-report.txt

      - name: Generate checksums and release notes
        if: always()
        run: |
          cd artifacts
          find . -type f \( -iname "*.apk" -o -iname "*.aab" \) -exec sha256sum {} \; > checksums.sha256.txt 2>/dev/null || true

          cat > RELEASE_NOTES.txt << NOTES_EOF
          Universal Downloader — Build Artifacts Guide
          =============================================
          Commit: ${{ steps.meta.outputs.short_sha }} by ${{ steps.meta.outputs.commit_author }}
          Message: ${{ steps.meta.outputs.commit_msg }}
          Built: ${{ steps.meta.outputs.build_date }}

          CHANGELOG:
          ${{ steps.changelog.outputs.changelog }}

          UNIVERSAL APK (install this — works on all Android devices):
            Download "universal-apk" artifact -> extract -> install the single .apk inside.

          SPLIT ABI APKs (smaller size, advanced users only):
            Pick the ONE file matching your device's processor (arm64-v8a covers almost all
            modern phones) -> install only that one. Do not install all 4.

          AAB (App Bundle):
            For future Play Store submission or advanced bundle-aware installers.

          Verify integrity: compare checksums.sha256.txt against the downloaded file.
          See size-report.txt for per-artifact file sizes.
          NOTES_EOF

          cat RELEASE_NOTES.txt

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Upload Universal APK (install this)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universal-apk
          path: artifacts/universal/*.apk
          if-no-files-found: ignore

      - name: Upload Split ABI APKs (advanced)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: split-abi-apks
          path: artifacts/split-abi/*.apk
          if-no-files-found: ignore

      - name: Upload AAB (App Bundle)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle-aab
          path: artifacts/aab/*.aab
          if-no-files-found: ignore

      - name: Upload checksums + release notes + size report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-info
          path: |
            artifacts/checksums.sha256.txt
            artifacts/RELEASE_NOTES.txt
            artifacts/size-report.txt
          if-no-files-found: ignore

      - name: Upload full build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/build/outputs/logs/**
            app/build/reports/**
          if-no-files-found: ignore

      - name: Write build summary
        if: always()
        run: |
          {
            echo "## Build Summary"
            echo "**Commit:** ${{ steps.meta.outputs.short_sha }} by ${{ steps.meta.outputs.commit_author }}"
            echo "**Message:** ${{ steps.meta.outputs.commit_msg }}"
            echo "**Built:** ${{ steps.meta.outputs.build_date }}"
            echo ""
            echo "### Artifact sizes"
            echo '```'
            cat artifacts/size-report.txt 2>/dev/null || echo "no artifacts"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release (manual trigger only)
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.meta.outputs.short_sha }}
          name: "Build ${{ steps.meta.outputs.short_sha }}"
          body_path: artifacts/RELEASE_NOTES.txt
          files: |
            artifacts/universal/*.apk
            artifacts/split-abi/*.apk
            artifacts/aab/*.aab
            artifacts/checksums.sha256.txt
          draft: false
          prerelease: true
