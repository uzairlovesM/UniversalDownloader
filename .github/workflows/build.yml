name: Build Universal Downloader

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a GitHub Release for this build'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Submits this repo's dependency tree to GitHub's Dependency Graph (Insights > Dependency graph),
      # which also powers Dependabot security alerts for this project going forward.
      - name: Submit dependency graph
        uses: gradle/actions/dependency-submission@v4
        continue-on-error: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore keystore from secret
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore.jks

      - name: Decode google-services.json (if present)
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json
          else
            echo "Skipping — Firebase not yet configured"
          fi

      - name: Compute build metadata
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          COMMIT_MSG=$(git log -1 --pretty=%s)
          COMMIT_AUTHOR=$(git log -1 --pretty=%an)
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"
          echo "commit_msg=$COMMIT_MSG" >> "$GITHUB_OUTPUT"
          echo "commit_author=$COMMIT_AUTHOR" >> "$GITHUB_OUTPUT"

      - name: Generate changelog since last tag
        id: changelog
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            echo "Changes since $LAST_TAG:" > changelog.txt
            git log "$LAST_TAG"..HEAD --pretty="- %s (%an)" >> changelog.txt
          else
            echo "Initial build — full commit history:" > changelog.txt
            git log --pretty="- %s (%an)" | head -30 >> changelog.txt
          fi
          cat changelog.txt
          {
            echo "changelog<<CHANGELOG_EOF"
            cat changelog.txt
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run Android Lint
        run: ./gradlew lintDebug --stacktrace
        continue-on-error: true

      - name: Upload Lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
        continue-on-error: true

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: ignore

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # Universal APK only — per project decision, split-ABI/AAB loose files are no longer
      # published as separate artifacts. The AAB is still built internally because it's the
      # required INPUT for generating the .apks bundle below via bundletool.
      - name: Build Release Universal APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build Release AAB (required input for .apks bundle)
        run: ./gradlew bundleRelease --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # bundletool converts the AAB into a single .apks file — a proper zip-based APK Set
      # containing base.apk + split APKs for every device config, installable via
      # `bundletool install-apks` or by devices/installers that understand the .apks format.
      - name: Download bundletool
        run: |
          curl -sL -o bundletool.jar \
            "https://github.com/google/bundletool/releases/latest/download/bundletool-all.jar"

      - name: Generate .apks bundle from AAB
        run: |
          AAB_FILE=$(find app/build/outputs/bundle/release -iname "*.aab" | head -1)
          java -jar bundletool.jar build-apks \
            --bundle="$AAB_FILE" \
            --output=artifacts-apks/UniversalDownloader.apks \
            --ks=release.keystore.jks \
            --ks-pass=pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --ks-key-alias=universaldownloader \
            --key-pass=pass:${{ secrets.KEY_PASSWORD }} \
            --mode=universal
          mkdir -p artifacts-apks-full
          java -jar bundletool.jar build-apks \
            --bundle="$AAB_FILE" \
            --output=artifacts-apks-full/UniversalDownloader-full.apks \
            --ks=release.keystore.jks \
            --ks-pass=pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --ks-key-alias=universaldownloader \
            --key-pass=pass:${{ secrets.KEY_PASSWORD }}
        continue-on-error: true

      - name: Organize and label release artifacts
        if: always()
        run: |
          mkdir -p artifacts/universal artifacts/apks

          find app/build/outputs/apk/release -iname "*universal*.apk" -exec cp {} artifacts/universal/ \; 2>/dev/null || true
          find artifacts-apks-full -iname "*.apks" -exec cp {} artifacts/apks/ \; 2>/dev/null || true

          SHA="${{ steps.meta.outputs.short_sha }}"
          for f in artifacts/universal/*.apk; do
            [ -f "$f" ] && mv "$f" "artifacts/universal/UniversalDownloader-universal-$SHA.apk"
          done
          for f in artifacts/apks/*.apks; do
            [ -f "$f" ] && mv "$f" "artifacts/apks/UniversalDownloader-$SHA.apks"
          done

          echo "=== Universal APK ==="
          ls -la artifacts/universal/ 2>/dev/null || echo "none"
          echo "=== APKS Bundle (base + all splits, one installable file) ==="
          ls -la artifacts/apks/ 2>/dev/null || echo "none"

      - name: Generate APK size report
        if: always()
        run: |
          echo "=== APK / APKS Size Report ===" > artifacts/size-report.txt
          for f in artifacts/universal/*.apk artifacts/apks/*.apks; do
            if [ -f "$f" ]; then
              SIZE=$(du -h "$f" | cut -f1)
              echo "$(basename "$f"): $SIZE" >> artifacts/size-report.txt
            fi
          done
          cat artifacts/size-report.txt

      - name: Generate checksums and release notes
        if: always()
        run: |
          cd artifacts
          find . -type f \( -iname "*.apk" -o -iname "*.apks" \) -exec sha256sum {} \; > checksums.sha256.txt 2>/dev/null || true

          cat > RELEASE_NOTES.txt << NOTES_EOF
          Universal Downloader — Build Artifacts Guide
          =============================================
          Commit: ${{ steps.meta.outputs.short_sha }} by ${{ steps.meta.outputs.commit_author }}
          Message: ${{ steps.meta.outputs.commit_msg }}
          Built: ${{ steps.meta.outputs.build_date }}

          CHANGELOG:
          ${{ steps.changelog.outputs.changelog }}

          UNIVERSAL APK (simplest — install this directly):
            Single .apk file, works on all Android devices, larger file size.

          APKS BUNDLE (base.apk + per-device splits in one zip-based file):
            Install with bundletool: java -jar bundletool.jar install-apks --apks=FILE.apks
            Or use any installer that supports the .apks / APK Set format.

          Verify integrity: compare checksums.sha256.txt against the downloaded file.
          NOTES_EOF
          cat RELEASE_NOTES.txt

      - name: Upload Universal APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: universal-apk
          path: artifacts/universal/*.apk
          if-no-files-found: ignore

      - name: Upload APKS Bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: apks-bundle
          path: artifacts/apks/*.apks
          if-no-files-found: ignore

      - name: Upload checksums + release notes + size report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: release-info
          path: |
            artifacts/checksums.sha256.txt
            artifacts/RELEASE_NOTES.txt
            artifacts/size-report.txt
          if-no-files-found: ignore

      - name: Upload full build logs (only on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: build-logs
          path: |
            app/build/outputs/logs/**
            app/build/reports/**
          if-no-files-found: ignore

      - name: Write build summary
        if: always()
        run: |
          {
            echo "## Build Summary"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Commit | ${{ steps.meta.outputs.short_sha }} |"
            echo "| Author | ${{ steps.meta.outputs.commit_author }} |"
            echo "| Message | ${{ steps.meta.outputs.commit_msg }} |"
            echo "| Built | ${{ steps.meta.outputs.build_date }} |"
            echo ""
            echo "### Artifact sizes"
            echo '```'
            cat artifacts/size-report.txt 2>/dev/null || echo "no artifacts"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release (manual trigger only)
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.meta.outputs.short_sha }}
          name: "Build ${{ steps.meta.outputs.short_sha }}"
          body_path: artifacts/RELEASE_NOTES.txt
          files: |
            artifacts/universal/*.apk
            artifacts/apks/*.apks
            artifacts/checksums.sha256.txt
          draft: false
          prerelease: true
